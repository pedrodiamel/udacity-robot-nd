services:
  ndros:
    stdin_open: true
    tty: true
    ipc: host
    privileged: true
    image: ndros
    build:
      context: .
      dockerfile: docker/jazzy.Dockerfile
    security_opt:
      - seccomp:unconfined
    gpus: all
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-42}
      - RMW_IMPLEMENTATION=${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
      - FASTDDS_DEFAULT_PROFILES_FILE=/cfg/fastdds.xml
      - FASTRTPS_DEFAULT_PROFILES_FILE=/cfg/fastdds.xml
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1

    cap_add:
      - CAP_SYS_ADMIN

    ports:
      - "6006:6006"

    volumes:
      - ${HOME}/.ros:/cfg:ro
      - .:/workspace/Project1
      - /tmp/.X11-unix:/tmp/.X11-unix
      - /dev/bus/usb:/dev/bus/usb
      - /dev/input:/dev/input
      - /etc/localtime:/etc/localtime:ro
      - ${HOME}/.Xauthority:/root/.Xauthority:ro
